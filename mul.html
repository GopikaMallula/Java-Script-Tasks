<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function add(){
            var n1=parseInt(document.getElementById("t1").value);
             var n2=parseInt(document.getElementById("t2").value);
             var add=n1+n2
            document.getElementById("t3").value=add;
        }
          function multiply(){
            var n1=parseInt(document.getElementById("t1").value);
             var n2=parseInt(document.getElementById("t2").value);
             var product=n1*n2
            document.getElementById("t3").value=product;
        }
    </script>
</head>
<body>
    <label for="">Enter Num1</label>
    <input type="text" id="t1">
    <br><br>
    <label for="">Enter Num2</label>
    <input type="text" id="t2">
    <br><br>
    <label for="">Result:</label>
    <input type="text" id="t3">
    <br><br>
    <button onclick="multiply()">multi</button>
    <button onclick="add()">ADd</button>
    
</body>
</html>
